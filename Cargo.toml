[package]
name = "teks"
version = "0.1.1"
edition = "2024"
description = "Local SMS testing for developers"
license = "MIT"
repository = "https://github.com/kentj-dev/teks"
homepage = "https://github.com/kentj-dev/teks"
readme = "README.md"
keywords = ["sms", "testing", "twilio", "mock", "developer-tools"]
categories = ["development-tools::testing", "command-line-utilities"]

[dependencies]
async-stream = "0.3"
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
directories = "6"
futures-core = "0.3"
getrandom = "0.4"
mime_guess = "2"
open = "5"
rusqlite = { version = "0.37", features = ["bundled"] }
rust-embed = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_urlencoded = "0.7"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "net", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
